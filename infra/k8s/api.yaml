apiVersion: apps/v1
kind: Deployment
metadata: { name: news-api, namespace: news-platform }
spec:
  replicas: 3
  selector: { matchLabels: { app: news-api } }
  template:
    metadata: { labels: { app: news-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/news-api:latest
          ports: [{containerPort: 4000}]
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
---
apiVersion: v1
kind: Service
metadata: { name: news-api, namespace: news-platform }
spec:
  selector: { app: news-api }
  ports: [{port: 4000, targetPort: 4000}]
